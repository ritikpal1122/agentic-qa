name: demo-e2e

on:
  push:
    paths: ['demo/**', '.github/workflows/demo-e2e.yml']
  pull_request:
    paths: ['demo/**', '.github/workflows/demo-e2e.yml']
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this tag, e.g. @TEAM-42'
        required: false
        default: '@smoke'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/teamhub/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep "${{ github.event.inputs.grep || '@smoke' }}"
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: demo/teamhub/e2e/test-results
          retention-days: 7
